<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Mapengo Innovations</title>
  <meta name="description" content="Contact Mapengo Innovations to discuss a digital system for your business or organisation.">
  <link rel="canonical" href="https://www.mapengoinnovations.co.za/contact/">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="hero hero-page" aria-label="Contact hero">
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="container hero-inner">
        <span class="overline">Contact</span>
        <h1>If you need a system for your business, get in touch.</h1>
        <p class="lead">Share your operational challenge and we will reply with practical next steps.</p>
      </div>
    </section>

    <section class="section contact-section" aria-labelledby="contact-heading">
      <div class="container contact-shell">
        <div class="contact-form-container reveal-up">
          <div class="contact-form-head">
            <h2 id="contact-heading">Contact us</h2>
            <p>Tell us what system you need and who will use it.</p>
          </div>

          <form id="contact-form" class="business-form" action="https://formspree.io/f/xeervaqa" method="POST" novalidate data-success-redirect="./thank-you/">
            <input type="hidden" name="_subject" value="New Business System Enquiry">
            <input type="hidden" name="_next" value="./thank-you/">
            <input type="text" name="_gotcha" class="sr-only" tabindex="-1" autocomplete="off" aria-hidden="true">

            <div class="form-grid">
              <div class="form-group">
                <label for="contact-name">Name <span class="required">*</span></label>
                <input id="contact-name" name="full_name" type="text" class="form-input" autocomplete="name" required>
              </div>
              <div class="form-group">
                <label for="contact-email">Email <span class="required">*</span></label>
                <input id="contact-email" name="email" type="email" class="form-input" autocomplete="email" required>
              </div>
            </div>

            <div class="form-group">
              <label for="contact-phone">Phone</label>
              <input id="contact-phone" name="phone" type="tel" class="form-input" autocomplete="tel" placeholder="e.g. +27 ...">
            </div>

            <div class="form-group">
              <label for="project-type">System Type <span style="color:var(--color-muted-dark);">(Optional)</span></label>
              <select id="project-type" name="project_type" class="form-input">
                <option value="">Select system type</option>
                <option value="web-application">Web Application Development</option>
                <option value="booking-system">Booking & Reservation System</option>
                <option value="management-system">Business Management System</option>
                <option value="frontend">Frontend Development</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="contact-message">Message <span class="required">*</span></label>
              <textarea id="contact-message" name="message" class="form-textarea" required placeholder="Briefly explain your business process and what you need the system to do."></textarea>
            </div>

            <button id="contact-submit" type="submit" class="btn btn-primary btn-lg submit-btn">
              <span class="submit-btn-label">Send Message</span>
            </button>
          </form>

          <p class="contact-fallback">Email: <a href="mailto:info@mapengoinnovations.co.za">info@mapengoinnovations.co.za</a></p>
          <p class="contact-fallback">Phone: <a href="tel:+27665520197">+27 66 552 0197</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="../assets/js/components.js" defer></script>
  <script src="../assets/js/main.js" defer></script>
</body>
</html>
