<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <title>Contact Us</title>
</head>
<body>
    <!-- Contact Section -->
    <section class="contact" id="contact">
        <div class="contact-container">
            <h1>Contact Us</h1>
            <form action="https://formspree.io/f/xwpkkvnk" class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required minlength="2" maxlength="50" pattern="[a-zA-Z ]+" aria-label="Name field" title="Please enter a valid name (letters and spaces only)">
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" required aria-label="Email field" title="Please enter a valid email address">
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="5" required minlength="10" maxlength="500" aria-label="Message field" title="Message should be between 10 and 500 characters"></textarea>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="privacyPolicy" name="privacyPolicy" required>
                    <label for="privacyPolicy">I agree to the <a href="privacy.html">Privacy Policy</a>.</label>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="communicationOptIn" name="communicationOptIn">
                    <label for="communicationOptIn">I would like to receive updates and promotional communications.</label>
                </div>
                <button type="submit" class="button contact-button">Send Message</button>
            </form>
            <div id="loader" style="display:none;" aria-live="polite">
                <img src="loader.gif" alt="Loading...">
            </div>
            <div id="response" style="display:none;" aria-live="polite"></div>
        </div>
    </section>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault();
            document.getElementById('loader').style.display = 'block';

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            const privacyPolicy = document.getElementById('privacyPolicy').checked;
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {
                showResponse('Please enter a valid email address.', 'error');
                return;
            }

            if (!privacyPolicy) {
                showResponse('You must agree to the Privacy Policy before submitting.', 'error');
                return;
            }

            if (!name || !email || !message) {
                showResponse('Please fill in all required fields.', 'error');
                return;
            }

            if (!navigator.onLine) {
                showResponse('It seems there’s an issue with your internet connection. Please check your connection and try again.', 'error');
                return;
            }

            const formData = new FormData(this);

            fetch(this.action, {
                method: 'POST',
                body: formData,
                headers: {
                    Accept: 'application/json'
                }
            })
            .then(response => {
                document.getElementById('loader').style.display = 'none';
                if (response.ok) {
                    showResponse('Thank you! Your message has been successfully sent.', 'success');
                    this.reset();
                } else {
                    showResponse('Oops! There was an issue with your submission. Please try again later.', 'error');
                }
            })
            .catch(error => {
                document.getElementById('loader').style.display = 'none';
                if (!navigator.onLine) {
                    showResponse('It seems there’s an issue with your internet connection. Please check your connection and try again.', 'error');
                } else {
                    showResponse('There was a problem with your submission. Please try again later.', 'error');
                }
            });
        });

        function showResponse(message, type) {
            const responseDiv = document.getElementById('response');
            responseDiv.style.display = 'block';
            responseDiv.textContent = message;
            responseDiv.className = type === 'success' ? 'success-message' : 'error-message';
            setTimeout(() => {
                responseDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
