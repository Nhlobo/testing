<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Mapengo Innovations</title>
  <meta name="description" content="Contact Mapengo Innovations to build or improve your software system.">
  <link rel="canonical" href="https://www.mapengoinnovations.co.za/contact/">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="hero hero-page" aria-label="Contact hero">
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="container hero-inner">
        <span class="overline">Contact</span>
        <h1>Let’s discuss your project requirements</h1>
        <p class="lead">If you’re looking to build or improve a system, feel free to reach out.</p>
      </div>
    </section>

    <section class="section contact-section" aria-labelledby="contact-heading">
      <div class="container contact-shell">
        <div class="contact-form-container reveal-up">
          <div class="contact-form-head">
            <h2 id="contact-heading">Contact form</h2>
            <p>Share a short overview of what you need and we will respond by email.</p>
          </div>

          <form id="contact-form" class="business-form" action="https://formspree.io/f/xeervaqa" method="POST" novalidate data-success-redirect="./thank-you/">
            <input type="hidden" name="_subject" value="New Mapengo Project Enquiry">
            <input type="hidden" name="_next" value="./thank-you/">
            <input type="text" name="_gotcha" class="sr-only" tabindex="-1" autocomplete="off" aria-hidden="true">

            <div class="form-grid">
              <div class="form-group">
                <label for="contact-name">Full Name <span class="required">*</span></label>
                <input id="contact-name" name="full_name" type="text" class="form-input" autocomplete="name" required>
              </div>
              <div class="form-group">
                <label for="contact-email">Email Address <span class="required">*</span></label>
                <input id="contact-email" name="email" type="email" class="form-input" autocomplete="email" required>
              </div>
            </div>

            <div class="form-group">
              <label for="contact-message">Project Message <span class="required">*</span></label>
              <textarea id="contact-message" name="message" class="form-textarea" required placeholder="Tell us what system you want to build or improve."></textarea>
            </div>

            <button id="contact-submit" type="submit" class="btn btn-primary btn-lg submit-btn">
              <span class="submit-btn-label">Send Message</span>
            </button>
          </form>

          <p class="contact-fallback">Email: <a href="mailto:info@mapengoinnovations.co.za">info@mapengoinnovations.co.za</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="../assets/js/components.js" defer></script>
  <script src="../assets/js/main.js" defer></script>
</body>
</html>
