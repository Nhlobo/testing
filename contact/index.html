<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <title>Contact Us</title>
</head>
<body>
    <div class="contact-container">
        <h1>Contact Us</h1>
        <div class="contact-form-container">
            <form class="contact-form">
                <input type="text" class="form-input" placeholder="Your Name" required>
                <input type="email" class="form-input" placeholder="Your Email" required>
                <textarea class="form-textarea" placeholder="Your Message" required></textarea>
                <button type="submit" class="contact-button">Send</button>
            </form>
            <div class="success-message hidden">Your message has been sent successfully!</div>
            <div class="error-message hidden">There was an error sending your message. Please try again.</div>
        </div>
    </div>
</body>
</html>
