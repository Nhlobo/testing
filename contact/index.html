<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <title>Contact Mapengo Innovations</title>
</head>
<body>
    <div class="contact-container">
        <h1>Let's Discuss Your Project</h1>
        <div class="contact-form-container">
            <form class="contact-form">
                <input type="text" class="form-input" placeholder="Your Name" required>
                <input type="email" class="form-input" placeholder="Your Email" required>
                <textarea class="form-textarea" placeholder="Tell us what you need built" required></textarea>
                <button type="submit" class="contact-button">Send Enquiry</button>
            </form>
            <div class="success-message hidden">Thanks for contacting Mapengo Innovations. We will get back to you soon.</div>
            <div class="error-message hidden">We could not send your message. Please try again or email us directly.</div>
        </div>
    </div>
</body>
</html>
