name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check dependency review availability
        id: dependency-review-support
        env:
          REPO: ${{ github.repository }}
        run: |
          api_url="https://api.github.com/repos/$REPO"
          response=$(curl -sSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "$api_url")

          if ! status=$(printf '%s' "$response" | jq -r '.security_and_analysis.advanced_security.status // empty'); then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "Unable to determine dependency review support from repository metadata."
            exit 0
          fi

          if [ "$status" = "enabled" ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "Dependency review is unavailable because GitHub Advanced Security is not enabled."
          fi

      - name: Dependency Review
        if: steps.dependency-review-support.outputs.supported == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, AGPL-1.0, AGPL-3.0
