name: Weekly Security Alerts Summary

on:
  schedule:
    - cron: '35 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  security-events: read
  issues: write

jobs:
  summarize-security-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Build weekly security summary
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const codeScanning = await github.paginate(
              github.rest.codeScanning.listAlertsForRepo,
              { owner, repo, state: 'open', per_page: 100 }
            );

            let secretScanning = [];
            try {
              secretScanning = await github.paginate(
                github.rest.secretScanning.listAlertsForRepo,
                { owner, repo, state: 'open', per_page: 100 }
              );
            } catch (error) {
              core.warning(`Secret scanning alerts unavailable: ${error.message}`);
            }

            const severities = { critical: 0, high: 0, medium: 0, low: 0, note: 0, warning: 0, error: 0 };
            for (const alert of codeScanning) {
              const severity = alert.rule?.security_severity_level || alert.rule?.severity || 'note';
              const key = String(severity).toLowerCase();
              if (Object.prototype.hasOwnProperty.call(severities, key)) {
                severities[key] += 1;
              } else {
                severities.note += 1;
              }
            }

            const generatedAt = new Date().toISOString();
            const body = [
              `## Weekly Security Alert Summary`,
              `Generated: ${generatedAt}`,
              '',
              `### Open Code Scanning Alerts (${codeScanning.length})`,
              `- Critical: ${severities.critical}`,
              `- High: ${severities.high}`,
              `- Medium: ${severities.medium}`,
              `- Low: ${severities.low}`,
              `- Note/Warning/Error: ${severities.note + severities.warning + severities.error}`,
              '',
              `### Open Secret Scanning Alerts (${secretScanning.length})`,
              '',
              `### Required triage actions`,
              `- [ ] Review and assign all critical/high alerts within 24 hours.`,
              `- [ ] Confirm SLA owner and due date for every open alert.`,
              `- [ ] Close false positives with dismissal reason and evidence.`,
              `- [ ] Track remediation progress in this issue thread.`
            ].join('\n');

            const issueTitle = 'Weekly security alerts summary';
            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
              labels: 'security,triage'
            });

            const summaryIssue = existing.data.find((issue) => issue.title === issueTitle);

            if (summaryIssue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: summaryIssue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body,
                labels: ['security', 'triage']
              });
            }
